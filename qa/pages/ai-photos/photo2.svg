<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="lampGlow2" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="30%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
    <filter id="softGlow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#wallGrad)" rx="8"/>

  <line x1="0" y1="120" x2="400" y2="135" stroke="#475569" stroke-width="3"/>
  <rect x="40" y="40" width="80" height="85" fill="#475569" opacity="0.4"/>

  <polygon points="20,310 380,290 395,350 5,370" fill="#0f172a"/>

  <polygon points="50,290 140,285 145,305 45,310" fill="#f59e0b"/>
  <polygon points="55,275 135,270 140,290 50,295" fill="#10b981"/>

  <ellipse cx="250" cy="285" rx="70" ry="18" fill="#78350f"/>
  <ellipse cx="250" cy="280" rx="70" ry="18" fill="#92400e"/>

  <circle cx="250" cy="190" r="50" fill="url(#lampGlow2)" filter="url(#softGlow2)"/>
  <circle cx="235" cy="175" r="12" fill="#ffffff" opacity="0.75"/>

  <path d="M210,130 Q250,90 290,130 Q330,170 290,210" fill="none" stroke="#e879f9" stroke-width="2" opacity="0.6"/>

  <rect x="20" y="20" width="130" height="24" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="85" y="36" font-size="11" font-family="sans-serif" font-weight="bold" fill="#f43f5e" text-anchor="middle">SYNTHETIC / AI</text>

  <text x="200" y="385" font-size="12" font-family="sans-serif" font-weight="600" fill="#94a3b8" text-anchor="middle">Vedere ambientala (Artefacte geometrice AI)</text>
</svg>
