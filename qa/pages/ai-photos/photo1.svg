  <text x="85" y="36" font-size="11" font-family="sans-serif" font-weight="bold" fill="#f43f5e" text-anchor="middle">SYNTHETIC / AI</text>

  <text x="200" y="380" font-size="12" font-family="sans-serif" font-weight="600" fill="#94a3b8" text-anchor="middle">Lampa CrystalGlow Orb (Randare AI sintetica)</text>
